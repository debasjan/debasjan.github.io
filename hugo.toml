baseURL = "https://debasjan.github.io/"
locale = "en-US"
defaultContentLanguage = "en"
title = "debas — pentesting & security blog"
theme = "PaperMod"

enableRobotsTXT = true
enableEmoji = true
hasCJKLanguage = false
pygmentsUseClasses = true

[pagination]
  pagerSize = 12

[minify]
  disableXML = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  [params.label]
    text = "debas"

  env = "production"
  title = "debas — pentesting & security blog"
  description = "Write-ups from HackTheBox and OSCP labs, and offensive-security material by debas."
  keywords = ["pentesting", "security", "hackthebox", "oscp", "active directory", "cybersecurity", "write-ups", "ethical hacking"]
  author = "Jan Jędrzejak (debas)"
  images = ["images/og-cover.png"]
  DateFormat = "January 2, 2006"
  defaultTheme = "dark"
  disableThemeToggle = true
  ShowShareButtons = false
  ShowReadingTime = true
  displayFullLangName = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = false
  ShowRssButtonInSectionTermList = true
  ShowAllPagesInArchive = true
  ShowToc = true
  TocOpen = false
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = false

  [params.homeInfoParams]
    Title = "the <span class=\"accent\">debas</span> blog"
    Content = """
Hacking and offensive security content — write-ups from HackTheBox machines
and notes from my OSCP preparation, focused on the reasoning behind each
step, not just a list of commands.
"""

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/debasjan"
  [[params.socialIcons]]
    name = "rss"
    url = "index.xml"

  [params.assets]
    disableHLJS = true
    favicon = "/favicon.ico"
    favicon16x16 = "/favicon-16x16.png"
    favicon32x32 = "/favicon-32x32.png"
    apple_touch_icon = "/apple-touch-icon.png"

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

[menu]
  [[menu.main]]
    identifier = "home"
    name = "Home"
    url = "/"
    weight = 5
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 10
  [[menu.main]]
    identifier = "certifications"
    name = "Certifications"
    url = "/certifications/"
    weight = 15
  [[menu.main]]
    identifier = "writeups"
    name = "Write-ups"
    url = "/writeups/"
    weight = 20
  [[menu.main]]
    identifier = "portfolio"
    name = "Portfolio"
    url = "https://github.com/debasjan/security-portfolio"
    weight = 30
  [[menu.main]]
    identifier = "search"
    name = "Search"
    url = "/search/"
    weight = 40

[taxonomies]
  tag = "tags"
  category = "categories"
  series = "series"

[privacy]
  [privacy.vimeo]
    disabled = false
    simple = true
  [privacy.x]
    disabled = false
    enableDNT = true
    simple = true
  [privacy.instagram]
    disabled = false
    simple = true
  [privacy.youtube]
    disabled = false
    privacyEnhanced = true

[services]
  [services.instagram]
    disableInlineCSS = true
  [services.x]
    disableInlineCSS = true

[markup]
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = true
    style = "monokai"
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    endLevel = 4
    ordered = false
    startLevel = 2
