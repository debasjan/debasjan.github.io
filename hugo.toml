baseURL = "https://debasjan.github.io/"
locale = "pl-PL"
defaultContentLanguage = "pl"
title = "debas — blog o pentestingu i security"
theme = "PaperMod"

enableRobotsTXT = true
enableEmoji = true
hasCJKLanguage = false
pygmentsUseClasses = true

[pagination]
  pagerSize = 10

[minify]
  disableXML = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  env = "production"
  title = "debas — blog o pentestingu i security"
  description = "Writeupy z labów HackTheBox i OSCP, notatki z bug bounty oraz materiały o pentestingu po polsku."
  keywords = ["pentesting", "security", "hackthebox", "oscp", "bug bounty", "cybersecurity", "writeupy", "ethical hacking"]
  author = "Jan Jędrzejak (debas)"
  DateFormat = "2 January 2006"
  defaultTheme = "dark"
  disableThemeToggle = false
  ShowShareButtons = false
  ShowReadingTime = true
  displayFullLangName = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = true
  ShowAllPagesInArchive = true
  ShowToc = true
  TocOpen = false
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = false

  [params.homeInfoParams]
    Title = "Cześć, tu debas 👋"
    Content = """
Piszę o ofensywnym bezpieczeństwie: writeupy z maszyn HackTheBox, notatki
z przygotowań do OSCP i znaleziska z bug bounty. Wszystko po polsku,
z naciskiem na tok rozumowania, nie tylko listę komend.

Zobacz też moje [portfolio na GitHubie](https://github.com/debasjan/security-portfolio)
z pełnymi writeupami i metodologią.
"""

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/debasjan"
  [[params.socialIcons]]
    name = "rss"
    url = "index.xml"

  [params.assets]
    disableHLJS = true

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

[menu]
  [[menu.main]]
    identifier = "writeupy"
    name = "Writeupy"
    url = "/writeupy/"
    weight = 10
  [[menu.main]]
    identifier = "o-mnie"
    name = "O mnie"
    url = "/o-mnie/"
    weight = 20
  [[menu.main]]
    identifier = "portfolio"
    name = "Portfolio"
    url = "https://github.com/debasjan/security-portfolio"
    weight = 30
  [[menu.main]]
    identifier = "search"
    name = "Szukaj"
    url = "/szukaj/"
    weight = 40
  [[menu.main]]
    identifier = "archiwum"
    name = "Archiwum"
    url = "/archiwum/"
    weight = 50

[taxonomies]
  tag = "tags"
  category = "categories"
  series = "series"

[privacy]
  [privacy.vimeo]
    disabled = false
    simple = true
  [privacy.x]
    disabled = false
    enableDNT = true
    simple = true
  [privacy.instagram]
    disabled = false
    simple = true
  [privacy.youtube]
    disabled = false
    privacyEnhanced = true

[services]
  [services.instagram]
    disableInlineCSS = true
  [services.x]
    disableInlineCSS = true

[markup]
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = true
    style = "monokai"
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    endLevel = 4
    ordered = false
    startLevel = 2
